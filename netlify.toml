[build]
  command   = "npm install --include=dev --prefix backend && npm run build --prefix backend && npm install --include=dev --prefix frontend && npm run build --prefix frontend"
  publish   = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV      = "production"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler = "zisi"
  # Include the compiled backend plus the Prisma client + query engine.
  # npm workspaces may hoist node_modules to the repo root, so we cover
  # both the backend-local and root locations; globs that match nothing
  # are simply ignored by Netlify.
  included_files = [
    "backend/dist/**",
    "backend/prisma/**",
    "backend/node_modules/.prisma/**",
    "backend/node_modules/@prisma/client/**",
    "backend/node_modules/@prisma/adapter-libsql/**",
    "backend/node_modules/@libsql/**",
    "backend/node_modules/libsql/**",
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**",
    "node_modules/@prisma/adapter-libsql/**",
    "node_modules/@libsql/**",
    "node_modules/libsql/**"
  ]
