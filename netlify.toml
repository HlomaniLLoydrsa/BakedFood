[build]
  command   = "npm install --include=dev --prefix backend && npm run build --prefix backend && npm install --include=dev --prefix frontend && npm run build --prefix frontend"
  publish   = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV      = "development"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler = "zisi"
  included_files = ["backend/node_modules/.prisma/**", "backend/node_modules/@prisma/client/**", "backend/prisma/**"]
