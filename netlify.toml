[build]
  command   = "cd backend && npm install && cd ../frontend && npm install && npm run build"
  publish   = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV      = "development"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler = "zisi"
  included_files = ["backend/src/**", "backend/node_modules/**", "backend/prisma/**"]
