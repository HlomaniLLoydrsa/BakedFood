services:
  - type: web
    name: droply-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CODE
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
